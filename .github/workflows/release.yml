name: release

# Changesets flow:
#  - On push to master with pending changesets → opens/updates a "Version
#    Packages" PR that bumps the version + updates CHANGELOG.
#  - When that PR merges → publishes to npm (with provenance) and creates the
#    git tag + GitHub release.
on:
  push:
    branches: [master]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # create version-bump commits, tags, releases
  pull-requests: write # open/update the Version Packages PR
  id-token: write # npm provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      # Gate the release on a green build.
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true" # signed provenance via changeset publish
